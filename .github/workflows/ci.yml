name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # nx affected compares against the merge base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - uses: nrwl/nx-set-shas@v5
      - run: docker compose up -d --wait postgres
        env:
          WEB_IMAGE: unused
          API_IMAGE: unused
          SITE_DOMAIN: unused
          DATABASE_PASSWORD: ci-only
          JWT_SECRET: unused
          DATA_ENCRYPTION_KEY: unused
          COMPOSE_FILE: docker-compose.yml:docker-compose.local.yml

      - run: npx nx format:check
      - run: npx nx affected -t lint test build
        env:
          DATABASE_PASSWORD: ci-only
      - run: npx nx test server --coverage
        env:
          DATABASE_PASSWORD: ci-only
      # Lookups come from cdk.context.json, so this needs no AWS access.
      - run: npx nx run infra:synth

  container:
    runs-on: ubuntu-latest
    env:
      WEB_IMAGE: wayfinder-web:ci
      API_IMAGE: wayfinder-api:ci
      # localhost: Caddy uses its internal CA, not Let's Encrypt.
      SITE_DOMAIN: localhost
      DATABASE_PASSWORD: ci-only
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      DATA_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: |
          docker build -f Dockerfile.web -t "$WEB_IMAGE" .
          docker build -f Dockerfile.server -t "$API_IMAGE" .

      - name: Check the production compose override
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet

      - name: Start the stack behind Caddy
        run: docker compose up -d --wait --wait-timeout 120

      - name: Smoke test
        run: |
          expect() {
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$2")
            echo "$code $2"
            [ "$code" = "$1" ] || { echo "expected $1"; exit 1; }
          }
          expect 200 https://localhost/
          expect 200 https://localhost/work/gateway
          expect 200 https://localhost/sitemap.xml
          expect 404 https://localhost/no-such-page
          expect 308 http://localhost/
          expect 200 https://localhost/api/health
          expect 404 https://localhost/api/no-such-route
          curl -sk https://localhost/api/health | tee /dev/stderr | jq -e '.databaseReachable' >/dev/null || { echo 'API cannot reach Postgres'; exit 1; }
          curl -sk https://localhost/api/no-such-route | grep -q '"code":"NOT_FOUND"' || { echo 'API error has no code'; exit 1; }
          for url in https://localhost/ https://localhost/api/health; do
            headers=$(curl -skI "$url")
            echo "$headers" | grep -qi '^strict-transport-security:' || { echo "missing HSTS on $url"; exit 1; }
            if echo "$headers" | grep -qi '^x-powered-by:'; then echo "x-powered-by leaked on $url"; exit 1; fi
          done
          curl -skI https://localhost/admin/login | grep -qi '^x-robots-tag: noindex' || { echo '/admin is missing X-Robots-Tag'; exit 1; }
          if curl -skI https://localhost/work | grep -qi '^x-robots-tag:'; then echo 'a public page is marked noindex'; exit 1; fi
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Migrate, sign in and read the seeded projects, from the built image
        run: |
          docker compose exec -T api node main.js migrate:run
          echo 'ci-only-admin-password' | docker compose exec -T api node main.js create-admin --email admin@example.com
          jar=$(mktemp)
          sign_in() {
            curl -sk -o /dev/null -w '%{http_code}' -c "$jar" -H 'Content-Type: application/json' \
              -d "{\"email\":\"admin@example.com\",\"password\":\"$1\"}" https://localhost/api/auth/login
          }
          [ "$(sign_in not-the-password)" = 401 ] || { echo 'a wrong password was accepted'; exit 1; }
          [ "$(sign_in ci-only-admin-password)" = 204 ] || { echo 'sign-in failed'; exit 1; }
          curl -sk -b "$jar" https://localhost/api/auth/me | jq -e '.email == "admin@example.com"' >/dev/null || { echo 'no session after sign-in'; exit 1; }
          seeded='["gateway","lvcc","tempestas","wayfinder"]'
          curl -sk https://localhost/api/projects | jq -e "map(.slug) == $seeded" >/dev/null || { echo 'the seeded projects are not public'; exit 1; }
          curl -sk -b "$jar" https://localhost/api/admin/projects | jq -e 'length == 4 and all(.status == "published")' >/dev/null || { echo 'the admin cannot list projects'; exit 1; }

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Image sizes
        run: docker image ls 'wayfinder-*'
