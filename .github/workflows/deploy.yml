name: Deploy

# Dispatch by hand with a commit SHA to roll back.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (defaults to the tip of main)
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  REPOSITORY: wayfinder/web
  SITE_DOMAIN: underwoodstyles.ca

# Actions are pinned by SHA: this job holds AWS credentials, and tags can move.
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # The host is Graviton (arm64).
    runs-on: ubuntu-24.04-arm
    # The AWS deploy role trusts only this environment.
    environment:
      name: production
      url: https://underwoodstyles.ca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Resolve image
        id: image
        run: |
          sha=$(git rev-parse HEAD)
          echo "ref=${{ steps.ecr.outputs.registry }}/$REPOSITORY:$sha" >> "$GITHUB_OUTPUT"
          # Tags are immutable, so only "not found" means build; any other
          # error stops the deploy rather than looking like a missing image.
          if err=$(aws ecr describe-images --repository-name "$REPOSITORY" \
               --image-ids imageTag="$sha" 2>&1 >/dev/null); then
            echo "Image for $sha already exists; skipping the build"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif ! grep -q ImageNotFoundException <<<"$err"; then
            echo "$err"
            exit 1
          fi

      - if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: .github/scripts/deploy-to-host.sh
