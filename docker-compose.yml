# No ACME email: Let's Encrypt no longer sends expiry notices.

# Docker never rotates container logs by default, and the disk is 20 GB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to the image to run}
    restart: unless-stopped
    logging: *logging
    # Node as PID 1 ignores SIGTERM.
    init: true
    expose:
      - '4000'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    image: ${API_IMAGE:?set API_IMAGE to the image to run}
    restart: unless-stopped
    logging: *logging
    init: true
    expose:
      - '3000'
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: wayfinder
      DATABASE_NAME: wayfinder
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    # Passes with the database down: restarting the API would not fix that.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    logging: *logging
    expose:
      - '5432'
    environment:
      POSTGRES_USER: wayfinder
      POSTGRES_DB: wayfinder
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes:
      # Postgres 18 images keep data in a versioned subdirectory of this path.
      - postgres_data:/var/lib/postgresql
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'wayfinder', '-d', 'wayfinder']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN, e.g. underwoodstyles.ca}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the certificates; Let's Encrypt rate-limits re-issuing them.
      - caddy_data:/data
      - caddy_config:/config
    # Not on the API: an API failure must not take the public site down.
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
