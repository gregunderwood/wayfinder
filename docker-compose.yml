# Production stack for one host. The deploy pipeline writes WEB_IMAGE (an
# immutable, SHA-tagged image) and SITE_DOMAIN to the .env next to this file.
# No ACME email is set: Let's Encrypt no longer sends expiry notices, and
# Caddy renews on its own. The API and Postgres join here in Phase 3.

# Docker keeps container logs forever by default; on a 20 GB disk that is an
# outage on a timer. Cap each service at 3 × 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to the image to run}
    restart: unless-stopped
    logging: *logging
    # Node as PID 1 ignores SIGTERM, so every stop would wait out the 10 s kill
    # timeout. tini forwards the signal and reaps zombies.
    init: true
    expose:
      - '4000'
    # The container needs nothing writable and no Linux capabilities; if the
    # process is ever compromised it cannot modify its own code or escalate.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN, e.g. underwoodstyles.ca}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing, and Let's
      # Encrypt rate-limits a domain that does it repeatedly.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
